name: Coleta diária

# Coleta os dados do Portal da Transparência e grava na branch `data`.
#
# Por que uma branch só de dados: o histórico dela é o registro público e
# imutável dos snapshots (R3), e os commits diários não passam pelo fluxo
# develop → main (que é PR + release). A `main` só recebe código.
#
# Falha de validação (R2: soma ≠ totalizador) → o coletor sai com erro, nada é
# commitado e o site continua no último snapshot (o GitHub avisa por e-mail).
#
# Push feito com GITHUB_TOKEN não dispara workflow, por isso o deploy é chamado
# daqui mesmo, depois do commit.

on:
  schedule:
    # 09:17 UTC = 06:17 em Brasília. Minuto quebrado: o cron das horas cheias atrasa.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configurar git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Abrir a branch data em ./data
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git worktree add -B data data origin/data
          else
            echo "::notice::Branch data não existe — primeira coleta, criando órfã"
            git worktree add --orphan -b data data
          fi

      - name: Coletar
        run: npm run coletar

      # R8: nomes de contribuintes nunca podem chegar ao repositório.
      - name: Conferir que não há nomes
        run: |
          if grep -rl '"nome"' data/receitas data/totais data/codigos.json; then
            echo "::error::campo nome encontrado nos dados"
            exit 1
          fi

      - name: Commitar na branch data
        working-directory: data
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou"
            exit 0
          fi
          git commit -q -m "dados: coleta $(TZ=America/Sao_Paulo date +%F)"
          git push origin data

  deploy:
    needs: coleta
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
